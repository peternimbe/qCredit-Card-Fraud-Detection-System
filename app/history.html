<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .password-modal-backdrop { animation: fadeIn 0.3s ease-in-out; }
        .password-modal-content { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .lock-pulse { animation: pulse 2s ease-in-out infinite; }
        .notification { animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideDown { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">
    <script>
        if(localStorage.getItem('simplepay_auth') !== 'true'){
            location.href = 'signin.html';
        }
    </script>

    <div class="w-full max-w-md bg-white min-h-screen relative shadow-2xl flex flex-col overflow-hidden">
        
        <header class="fixed top-0 w-full max-w-md px-6 pt-8 pb-4 flex items-center gap-4 bg-white shadow-md z-30">
            <button class="text-gray-800" onclick="history.back()"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
            <h1 class="text-xl font-bold text-gray-800">Transaction History</h1>
        </header>

        <div class="px-6 mb-4 mt-24">
            <div class="bg-gray-50 rounded-2xl flex items-center px-4 py-3 gap-3 border border-gray-100">
                <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                <input type="text" placeholder="Search transactions..." class="bg-transparent outline-none text-sm w-full">
            </div>
        </div>

        <main class="flex-1 px-6 overflow-y-auto pb-28">
            <div id="txContainer" class="space-y-6"></div>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center shadow-lg z-30">
            <a class="flex flex-col items-center gap-1 text-gray-400" href="index.html">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px]">Account</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400" href="operations.html">
                <i data-lucide="compass" class="w-6 h-6"></i>
                <span class="text-[10px]">Actions</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-[#1a365d]" href="#">
                <i data-lucide="clock" class="w-6 h-6 text-[#1a365d]"></i>
                <span class="text-[10px] font-bold">History</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400" href="profile.html">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px]">Profile</span>
            </a>
        </nav>

        <div id="modalOverlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity flex items-end justify-center">
            <div id="modalContent" class="w-full max-w-md bg-white rounded-t-[40px] p-8 translate-y-full transition-transform">
                <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
                
                <div class="text-center mb-8">
                    <div id="modalIconBox" class="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center mb-4">
                        <i id="modalIcon" data-lucide="check-circle" class="w-8 h-8"></i>
                    </div>
                    <h2 id="modalTitle" class="text-lg font-bold text-gray-900">Transaction Details</h2>
                    <p id="modalStatus" class="text-green-500 font-semibold text-sm">Successful</p>
                </div>

                <div class="space-y-4 border-t border-gray-50 pt-6">
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm">Amount</span>
                        <span id="modalAmount" class="font-bold text-gray-800 text-sm">GHS 0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm">Reference</span>
                        <span id="modalRef" class="font-medium text-gray-800 text-sm">TRX-000000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm">Type</span>
                        <span id="modalType" class="font-medium text-gray-800 text-sm">Transfer</span>
                    </div>
                </div>

                <button onclick="closeModal()" class="w-full mt-10 py-4 bg-[#1a365d] text-white rounded-2xl font-bold shadow-lg">
                    Done
                </button>
            </div>
        </div>

        <!-- Beautiful Password Confirmation Modal -->
        <div id="passwordOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center password-modal-backdrop">
            <div class="w-full max-w-sm mx-4 bg-white rounded-3xl shadow-2xl overflow-hidden password-modal-content">
                <div class="bg-gradient-to-br from-[#1a365d] to-[#29abe2] px-8 pt-12 pb-8 text-center">
                    <div class="flex justify-center mb-4">
                        <div class="relative">
                            <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center">
                                <i data-lucide="lock" class="w-10 h-10 text-white lock-pulse"></i>
                            </div>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">Confirm Action</h3>
                    <p class="text-blue-100 text-sm">Enter your password to proceed</p>
                </div>
                <div class="px-8 py-8">
                    <div class="mb-6">
                        <label class="block text-gray-700 font-semibold mb-3">Password</label>
                        <div class="relative">
                            <input id="passwordInput" type="password" placeholder="••••••••" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#1a365d] focus:outline-none transition-colors duration-200 text-center text-lg tracking-widest" autocomplete="off" />
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                                <i id="toggleIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">Default password: 1234</p>
                    </div>
                    <div class="mb-6">
                        <div class="flex gap-1">
                            <div class="flex-1 h-1 bg-green-400 rounded-full"></div>
                            <div class="flex-1 h-1 bg-green-400 rounded-full"></div>
                            <div class="flex-1 h-1 bg-gray-200 rounded-full"></div>
                        </div>
                    </div>
                </div>
                <div class="px-8 pb-8 flex gap-3">
                    <button onclick="closePasswordModal()" class="flex-1 py-4 border-2 border-gray-200 text-gray-700 font-semibold rounded-2xl hover:bg-gray-50 transition-colors duration-200">Cancel</button>
                    <button id="passwordConfirmBtn" onclick="verifyPassword()" class="flex-1 py-4 bg-gradient-to-r from-[#1a365d] to-[#29abe2] text-white font-semibold rounded-2xl hover:shadow-lg transition-all duration-200 active:scale-95"><span id="confirmBtnText">Confirm</span></button>
                </div>
            </div>
        </div>

        <!-- Fraud Alert Notification -->
        <div id="fraudNotification" class="fixed top-20 left-4 right-4 max-w-sm mx-auto z-50 hidden notification">
            <div class="bg-red-50 border-2 border-red-300 rounded-2xl p-4 shadow-lg">
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-red-600"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-red-800">Fraud Alert</h4>
                        <p id="fraudMessage" class="text-sm text-red-700 mt-1">Suspicious activity detected</p>
                    </div>
                    <button onclick="closeFraudNotification()" class="text-red-400 hover:text-red-600">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        lucide.createIcons();

        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        const DEFAULT_PASSWORD = '1234';

        function togglePasswordVisibility(){
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            if(input.type === 'password'){
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function openPasswordModal(callback){
            const pwOverlay = document.getElementById('passwordOverlay');
            const input = document.getElementById('passwordInput');
            input.value = '';
            input.focus();
            pwOverlay.classList.remove('hidden');
            setTimeout(() => pwOverlay.classList.add('flex'), 10);
            window.passwordCallback = callback;
            input.onkeypress = (e) => { if(e.key === 'Enter') verifyPassword(); };
        }

        function closePasswordModal(){
            const pwOverlay = document.getElementById('passwordOverlay');
            pwOverlay.classList.remove('flex');
            pwOverlay.classList.add('hidden');
            document.getElementById('passwordInput').value = '';
            window.passwordCallback = null;
        }

        function verifyPassword(){
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('passwordConfirmBtn');
            const btnText = document.getElementById('confirmBtnText');
            if(password === DEFAULT_PASSWORD){
                btnText.innerText = 'Verified ✓';
                btn.disabled = true;
                btn.classList.add('opacity-75');
                if(window.passwordCallback) {
                    setTimeout(() => {
                        window.passwordCallback();
                        closePasswordModal();
                    }, 600);
                }
            } else {
                const input = document.getElementById('passwordInput');
                input.classList.add('border-red-500');
                input.classList.remove('border-gray-200');
                btnText.innerText = 'Wrong Password';
                btn.classList.add('bg-red-500');
                btn.classList.remove('from-[#1a365d]', 'to-[#29abe2]');
                setTimeout(() => {
                    input.classList.remove('border-red-500');
                    input.classList.add('border-gray-200');
                    btnText.innerText = 'Confirm';
                    btn.classList.remove('bg-red-500');
                    btn.classList.add('from-[#1a365d]', 'to-[#29abe2]');
                    input.value = '';
                    input.focus();
                }, 1500);
            }
        }

        function showFraudNotification(message){
            const notification = document.getElementById('fraudNotification');
            document.getElementById('fraudMessage').innerText = message;
            notification.classList.remove('hidden');
            setTimeout(() => { notification.classList.add('hidden'); }, 5000);
        }

        function closeFraudNotification(){
            document.getElementById('fraudNotification').classList.add('hidden');
        }

        function openModal(tx) {
            document.getElementById('modalTitle').innerText = tx.title || 'Transaction';
            document.getElementById('modalAmount').innerText = 'GHS ' + Math.abs(tx.amount).toFixed(2);
            document.getElementById('modalRef').innerText = tx.ref || tx.id || 'TRX-'+(Math.random()*100000|0);
            document.getElementById('modalType').innerText = tx.type || 'transfer';
            document.getElementById('modalStatus').innerText = tx.amount>=0 ? 'Successful' : 'Completed';

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            overlay.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => { overlay.classList.add('hidden'); }, 300);
        }

        overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

        // Render transactions from localStorage
        function sanitizeUserKey(user){
            return String(user || 'guest').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'guest';
        }

        function getScopedStorageKey(baseKey){
            const userKey = sanitizeUserKey(localStorage.getItem('simplepay_user'));
            return userKey ? `${baseKey}_${userKey}` : baseKey;
        }

        function getTx(){
            try {
                return JSON.parse(localStorage.getItem(getScopedStorageKey('simplepay_transactions'))||'[]');
            } catch (error) {
                return [];
            }
        }

        function renderTx(){
            const container = document.getElementById('txContainer'); container.innerHTML='';
            const tx = getTx();
            if(tx.length===0){ container.innerHTML = '<p class="text-center text-gray-400 mt-8">No transactions yet.</p>'; return; }
            tx.forEach(t=>{
                const el = document.createElement('div'); el.className='flex items-center gap-4 cursor-pointer active:opacity-70';
                const sign = t.amount>0 ? '+' : '-';
                el.innerHTML = `
                    <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center text-indigo-600">
                        <i data-lucide="repeat" class="w-6 h-6"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800">${t.title}</h4>
                        <p class="text-xs text-gray-500">${new Date(t.date).toLocaleString()} • ${t.type}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${t.amount>0? 'text-green-600':'text-gray-800'}">${sign} ${Math.abs(t.amount).toFixed(2)}</p>
                        <p class="text-[10px] text-gray-400">GHS</p>
                    </div>`;
                el.addEventListener('click', ()=> openModal(t));
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        // init
        (function(){ renderTx(); })();
    </script>
</body>
</html>
