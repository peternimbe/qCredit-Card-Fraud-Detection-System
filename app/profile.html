<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .password-modal-backdrop { animation: fadeIn 0.3s ease-in-out; }
        .password-modal-content { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .lock-pulse { animation: pulse 2s ease-in-out infinite; }
        .notification { animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideDown { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">
    <script>
        if(localStorage.getItem('simplepay_auth') !== 'true'){
            location.href = 'signin.html';
        }
    </script>

    <div class="w-full max-w-md bg-white min-h-screen relative shadow-2xl flex flex-col">
        
        <header class="fixed top-0 w-full max-w-md px-6 pt-8 pb-4 flex justify-between items-center bg-white shadow-md z-30">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Profile</h1>
                <p id="profileBalance" class="text-xs text-gray-500 mt-1">Balance: GHS 0.00</p>
            </div>
            <div class="flex gap-4 items-center text-gray-600">
                <i data-lucide="help-circle" class="w-6 h-6"></i>
                <div class="relative">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">7</span>
                </div>
                <i data-lucide="message-circle" class="w-6 h-6"></i>
            </div>
        </header>

        <main class="flex-1 px-6 overflow-y-auto pt-32 pb-28">
            
            <div class="flex items-center gap-4 mt-6 mb-8">
                <div id="profileInitials" class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-[#1a365d] font-bold text-xl">
                    U
                </div>
                <div>
                    <h2 id="profileName" class="text-xl font-bold text-gray-900">User</h2>
                    <p id="profileEmail" class="text-gray-500 text-sm">user@example.com</p>
                </div>
                <button class="ml-auto text-gray-400">
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-8">
                
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Account</h3>
                    <div class="space-y-5">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-gray-600">
                                <i data-lucide="user" class="w-5 h-5"></i>
                            </div>
                            <span class="font-semibold text-gray-800">Personal Information</span>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300"></i>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-gray-600">
                                <i data-lucide="shield-check" class="w-5 h-5"></i>
                            </div>
                            <span class="font-semibold text-gray-800">Security & Privacy</span>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Settings</h3>
                    <div class="space-y-5">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-gray-600">
                                <i data-lucide="bell" class="w-5 h-5"></i>
                            </div>
                            <span class="font-semibold text-gray-800">Notifications</span>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300"></i>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-gray-600">
                                <i data-lucide="banknote" class="w-5 h-5"></i>
                            </div>
                            <span class="font-semibold text-gray-800">Payment Methods</span>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Support</h3>
                    <div class="space-y-5">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-gray-600">
                                <i data-lucide="info" class="w-5 h-5"></i>
                            </div>
                            <span class="font-semibold text-gray-800">About App</span>
                            <i data-lucide="chevron-right" class="ml-auto w-5 h-5 text-gray-300"></i>
                        </div>
                        <div class="flex items-center gap-4 text-red-500">
                            <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                            </div>
                            <span onclick="logout()" class="font-semibold">Log Out</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

          <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center shadow-lg z-30">
            <a class="flex flex-col items-center gap-1 text-gray-400" href="index.html">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px]">Account</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400" href="operations.html">
                <i data-lucide="compass" class="w-6 h-6"></i>
                <span class="text-[10px]">Actions</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-gray-400" href="history.html">
                <i data-lucide="clock" class="w-6 h-6"></i>
                <span class="text-[10px]">History</span>
            </a>
            <a class="flex flex-col items-center gap-1  text-[#1a365d]" href="profile.html">
                <i data-lucide="user" class="w-6 h-6 text-[#1a365d]"></i>
                <span class="text-[10px] font-bold">Profile</span>
            </a>
        </nav>
        <!-- Beautiful Password Confirmation Modal -->
        <div id="passwordOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center password-modal-backdrop">
            <div class="w-full max-w-sm mx-4 bg-white rounded-3xl shadow-2xl overflow-hidden password-modal-content">
                <div class="bg-gradient-to-br from-[#1a365d] to-[#29abe2] px-8 pt-12 pb-8 text-center">
                    <div class="flex justify-center mb-4">
                        <div class="relative">
                            <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center">
                                <i data-lucide="lock" class="w-10 h-10 text-white lock-pulse"></i>
                            </div>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">Confirm Action</h3>
                    <p class="text-blue-100 text-sm">Enter your password to proceed</p>
                </div>
                <div class="px-8 py-8">
                    <div class="mb-6">
                        <label class="block text-gray-700 font-semibold mb-3">Password</label>
                        <div class="relative">
                            <input id="passwordInput" type="password" placeholder="••••••••" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#1a365d] focus:outline-none transition-colors duration-200 text-center text-lg tracking-widest" autocomplete="off" />
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                                <i id="toggleIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">Default password: 1234</p>
                    </div>
                    <div class="mb-6">
                        <div class="flex gap-1">
                            <div class="flex-1 h-1 bg-green-400 rounded-full"></div>
                            <div class="flex-1 h-1 bg-green-400 rounded-full"></div>
                            <div class="flex-1 h-1 bg-gray-200 rounded-full"></div>
                        </div>
                    </div>
                </div>
                <div class="px-8 pb-8 flex gap-3">
                    <button onclick="closePasswordModal()" class="flex-1 py-4 border-2 border-gray-200 text-gray-700 font-semibold rounded-2xl hover:bg-gray-50 transition-colors duration-200">Cancel</button>
                    <button id="passwordConfirmBtn" onclick="verifyPassword()" class="flex-1 py-4 bg-gradient-to-r from-[#1a365d] to-[#29abe2] text-white font-semibold rounded-2xl hover:shadow-lg transition-all duration-200 active:scale-95"><span id="confirmBtnText">Confirm</span></button>
                </div>
            </div>
        </div>

    </div>

    <script>

        const AUTH_KEY = 'simplepay_auth';
        const USER_KEY = 'simplepay_user';
        const USER_EMAIL_KEY = 'simplepay_user_email';
        const USER_NAME_KEY = 'simplepay_user_name';
        const USER_ACCOUNT_KEY = 'simplepay_user_account';
        const BAL_KEY = 'simplepay_balance';

        function sanitizeUserKey(user){
            return String(user || 'guest').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'guest';
        }

        function getScopedStorageKey(baseKey){
            const userKey = sanitizeUserKey(localStorage.getItem(USER_KEY));
            return userKey ? `${baseKey}_${userKey}` : baseKey;
        }

        function logout(){
            localStorage.removeItem(AUTH_KEY);
            localStorage.removeItem(USER_KEY);
            location.href = 'signin.html';
        }

        lucide.createIcons();
        const DEFAULT_PASSWORD = '1234';

        function togglePasswordVisibility(){
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            if(input.type === 'password'){
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function openPasswordModal(callback){
            const overlay = document.getElementById('passwordOverlay');
            const input = document.getElementById('passwordInput');
            input.value = '';
            input.focus();
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('flex'), 10);
            window.passwordCallback = callback;
            input.onkeypress = (e) => { if(e.key === 'Enter') verifyPassword(); };
        }

        function closePasswordModal(){
            const overlay = document.getElementById('passwordOverlay');
            overlay.classList.remove('flex');
            overlay.classList.add('hidden');
            document.getElementById('passwordInput').value = '';
            window.passwordCallback = null;
        }

        function verifyPassword(){
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('passwordConfirmBtn');
            const btnText = document.getElementById('confirmBtnText');
            if(password === DEFAULT_PASSWORD){
                btnText.innerText = 'Verified ✓';
                btn.disabled = true;
                btn.classList.add('opacity-75');
                if(window.passwordCallback) {
                    setTimeout(() => {
                        window.passwordCallback();
                        closePasswordModal();
                    }, 600);
                }
            } else {
                const input = document.getElementById('passwordInput');
                input.classList.add('border-red-500');
                input.classList.remove('border-gray-200');
                btnText.innerText = 'Wrong Password';
                btn.classList.add('bg-red-500');
                btn.classList.remove('from-[#1a365d]', 'to-[#29abe2]');
                setTimeout(() => {
                    input.classList.remove('border-red-500');
                    input.classList.add('border-gray-200');
                    btnText.innerText = 'Confirm';
                    btn.classList.remove('bg-red-500');
                    btn.classList.add('from-[#1a365d]', 'to-[#29abe2]');
                    input.value = '';
                    input.focus();
                }, 1500);
            }
        }

        function getBalance(){ return parseFloat(localStorage.getItem(getScopedStorageKey(BAL_KEY))||'0'); }

        function renderProfile(){
            const nameEl = document.getElementById('profileName');
            const emailEl = document.getElementById('profileEmail');
            const initialsEl = document.getElementById('profileInitials');
            const name = localStorage.getItem(USER_NAME_KEY) || 'User';
            const email = localStorage.getItem(USER_EMAIL_KEY) || 'user@example.com';
            const initials = name.split(' ').map(part => part[0]).join('').slice(0,2).toUpperCase() || 'U';
            if (nameEl) nameEl.innerText = name;
            if (emailEl) emailEl.innerText = email;
            if (initialsEl) initialsEl.innerText = initials;
        }

        (function(){
            const el = document.getElementById('profileBalance');
            if(el) el.innerText = 'Balance: GHS '+getBalance().toFixed(2);
            renderProfile();
        })();

    </script>
</body>
</html>
